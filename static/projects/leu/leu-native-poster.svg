<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Leu native learning companion</title>
  <desc id="desc">Editorial cover with a warm paper reader, highlighted source passage, and compact centered narration controls.</desc>
  <rect width="1440" height="900" fill="#171512"/>
  <text x="92" y="108" fill="#F4EFDF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="1.5">LEU</text>
  <text x="92" y="154" fill="#A9A398" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2.4">NATIVE LEARNING COMPANION</text>
  <rect x="340" y="58" width="1010" height="784" rx="26" fill="#F4EFDF"/>
  <text x="418" y="142" fill="#807A70" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.8">SOURCE / 04</text>
  <text x="418" y="208" fill="#191714" font-family="Georgia, Times New Roman, serif" font-size="42">What runs next?</text>
  <text x="418" y="282" fill="#3D3933" font-family="Georgia, Times New Roman, serif" font-size="28">A promise reaction becomes a microtask.</text>
  <rect x="408" y="316" width="846" height="102" rx="14" fill="#DCE6CF"/>
  <text x="430" y="358" fill="#191714" font-family="Georgia, Times New Roman, serif" font-size="26">The current task finishes first. Then queued</text>
  <text x="430" y="394" fill="#191714" font-family="Georgia, Times New Roman, serif" font-size="26">microtasks run before the next task begins.</text>
  <text x="418" y="476" fill="#807A70" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.6">DIAGNOSE → REPAIR → TEACH IT BACK</text>
  <line x1="418" y1="510" x2="1270" y2="510" stroke="#C8C0B1"/>
  <text x="418" y="566" fill="#191714" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Explain why the promise callback runs before the timer.</text>
  <text x="418" y="614" fill="#645F56" font-family="Arial, Helvetica, sans-serif" font-size="18">Return to the exact source whenever the explanation stops matching it.</text>
  <rect x="646" y="698" width="398" height="72" rx="36" fill="#E9E2D4" stroke="#C8C0B1"/>
  <circle cx="754" cy="734" r="22" fill="none" stroke="#191714" stroke-width="2"/>
  <path d="M761 723 L746 734 L761 745" fill="none" stroke="#191714" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="845" cy="734" r="26" fill="#191714"/>
  <path d="M838 723 L838 745 L856 734 Z" fill="#F4EFDF"/>
  <circle cx="936" cy="734" r="22" fill="none" stroke="#191714" stroke-width="2"/>
  <path d="M929 723 L944 734 L929 745" fill="none" stroke="#191714" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="792" fill="#F4EFDF" font-family="Georgia, Times New Roman, serif" font-size="34">Read.</text>
  <text x="92" y="833" fill="#DCE6CF" font-family="Georgia, Times New Roman, serif" font-size="34">Understand.</text>
</svg>