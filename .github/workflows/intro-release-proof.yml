name: Deployed release regression
on:
  push:
    branches: [diagnostics/intro-entry-proof]
permissions:
  contents: read
jobs:
  release-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci > /tmp/install.log 2>&1 || { cat /tmp/install.log; exit 1; }
      - run: npm run check && npm run test:unit
      - run: npx playwright install --with-deps chromium firefox webkit > /tmp/browser.log 2>&1 || { cat /tmp/browser.log; exit 1; }
      - name: Run the complete five-profile suite against the deployed fix
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'
          PLAYWRIGHT_BASE_URL: https://2fae57d0.miguelalmeida-portfolio.pages.dev
        run: npx playwright test --workers=3 --retries=0 --max-failures=3 --reporter=list,json > /tmp/release-test.log 2>&1 || { cat /tmp/release-test.log; exit 1; }
      - name: Show test results
        if: always()
        run: tail -n 20 /tmp/release-test.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-regression-proof
          path: |
            /tmp/release-test.log
            test-results
          retention-days: 7
