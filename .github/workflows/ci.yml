name: CI

on:
  # Validate test before promotion and main after release; manual dispatch remains available.
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  browser-smoke:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: Test the published portfolio in Chromium and WebKit
        env:
          PORTFOLIO_AUDIT_OUTPUT: ${{ github.workspace }}/test-results/release
        run: npx playwright test -c tests/e2e/portfolio-release.config.ts --project=${{ matrix.browser }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-smoke-failure-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 2

  scrollbar-regression:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Test scrollbar input, footer contacts and PDF navigation
        env:
          PORTFOLIO_AUDIT_OUTPUT: ${{ github.workspace }}/test-results/scrollbar
        run: npx playwright test -c tests/e2e/portfolio-release.config.ts --grep 'scrollbar|footer keyboard'
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scrollbar-regression-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 2

  validate:
    if: ${{ always() }}
    needs: [checks, browser-smoke, scrollbar-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require blocking checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SCROLLBAR_RESULT: ${{ needs.scrollbar-regression.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success && test "$SCROLLBAR_RESULT" = success
