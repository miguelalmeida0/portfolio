name: CI

on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main, dev, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  browser-smoke:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run critical desktop and mobile browser smoke
        run: |
          mkdir -p .cache/tmp
          TMPDIR=$PWD/.cache/tmp npx playwright test tests/e2e/specs/ci-smoke.spec.ts tests/e2e/specs/story-motion.spec.ts tests/e2e/specs/story-editorial-transition.spec.ts tests/e2e/specs/cv-highlights-alignment.spec.ts tests/e2e/specs/leu-showcase.spec.ts \
            --project=chromium-desktop \
            --project=chromium-mobile \
            --workers=2
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-smoke-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 2

  validate:
    if: ${{ always() }}
    needs: [checks, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require blocking checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success
