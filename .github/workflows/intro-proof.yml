name: Deployed intro proof
on:
  push:
    branches: [diagnostics/intro-entry-proof]
permissions:
  contents: read
jobs:
  deployed-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci > /tmp/install.log 2>&1 || { cat /tmp/install.log; exit 1; }
      - run: npx playwright install --with-deps chromium > /tmp/browser.log 2>&1 || { cat /tmp/browser.log; exit 1; }
      - name: Check deployed first visits and controlled hidden-page lifecycle
        run: |
          cat > /tmp/intro-proof.mjs <<'JS'
          import {chromium} from '${{ github.workspace }}/node_modules/playwright/index.mjs';
          import {mkdir,writeFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch();
          const results=[];
          const directory='/tmp/intro-proof';
          await mkdir(directory,{recursive:true});
          async function setup(context,controlledHidden){
            await context.addInitScript(hidden=>{
              window.proof={stages:[],shortcuts:0,inputs:[]};
              if(hidden){
                let isHidden=true;
                Object.defineProperty(document,'hidden',{configurable:true,get:()=>isHidden});
                Object.defineProperty(document,'visibilityState',{configurable:true,get:()=>isHidden?'hidden':'visible'});
                window.activateProof=()=>{isHidden=false;document.dispatchEvent(new Event('visibilitychange'));};
              }
              for(const type of ['wheel','touchmove','keydown']) window.addEventListener(type,event=>window.proof.inputs.push({type,trusted:event.isTrusted}),{capture:true,passive:true});
              new MutationObserver(records=>{
                for(const record of records){
                  if(record.type==='attributes'){
                    const stage=record.target.getAttribute('data-stage');
                    if(stage && !window.proof.stages.includes(stage)) window.proof.stages.push(stage);
                  }
                  for(const node of record.addedNodes) if(node instanceof Element && node.matches('[data-shortcut-stairs]')) window.proof.shortcuts++;
                }
              }).observe(document,{childList:true,subtree:true,attributes:true,attributeFilter:['data-stage']});
            },controlledHidden);
          }
          async function state(page,label){
            const value={label,url:page.url(),...await page.evaluate(()=>({build:document.querySelector('meta[name="portfolio-build"]')?.content,presentation:document.documentElement.dataset.presentation,stage:document.querySelector('[data-pixel-intro]')?.dataset.stage,hidden:document.hidden,inert:document.querySelector('#portfolio-content')?.inert,scrollY,proof:window.proof}))};
            results.push(value);console.log('PROOF '+JSON.stringify(value));return value;
          }
          try{
            for(const [name,url] of [['production','https://miguelalmeida.is-a.dev/'],['candidate','https://2fae57d0.miguelalmeida-portfolio.pages.dev/']]){
              const context=await browser.newContext({viewport:{width:1440,height:1000},reducedMotion:'no-preference'});
              const errors=[];
              await setup(context,false);
              const page=await context.newPage();
              page.on('pageerror',error=>errors.push(error.message));
              const response=await page.goto(url,{waitUntil:'domcontentloaded'});
              assert.equal(response.status(),200);
              console.log('HEADERS '+JSON.stringify({name,cacheControl:response.headers()['cache-control']}));
              await page.waitForSelector('[data-pixel-intro][data-stage="typing"]');
              const first=await state(page,name+'-first-visit');
              assert.equal(first.presentation,'running');assert.equal(first.proof.shortcuts,0);assert.equal(first.scrollY,0);
              await page.waitForTimeout(2100);
              await page.screenshot({path:directory+'/'+name+'-first-visit.png'});
              await page.waitForTimeout(4500);
              const complete=await state(page,name+'-first-visit-complete');
              assert.equal(complete.presentation,'complete');assert.equal(complete.inert,false);assert.equal(complete.proof.shortcuts,0);assert.deepEqual(complete.proof.inputs,[]);
              assert.deepEqual(errors,[]);
              await context.close();
              // This is an explicit controlled lifecycle simulation, not a claim
              // that Playwright has placed a native browser tab in the background.
              const hiddenContext=await browser.newContext({viewport:{width:1440,height:1000},reducedMotion:'no-preference'});
              await setup(hiddenContext,true);
              const hidden=await hiddenContext.newPage();
              await hidden.goto(url,{waitUntil:'domcontentloaded'});
              await hidden.waitForTimeout(8500);
              const offscreen=await state(hidden,name+'-controlled-hidden-8500ms');
              const patched=offscreen.build==='2026.09.27-intro-visible-v7';
              assert.equal(offscreen.presentation,patched?'running':'complete');
              await hidden.evaluate(()=>window.activateProof());
              await hidden.waitForTimeout(1200);
              const active=await state(hidden,name+'-controlled-activation-1200ms');
              assert.equal(active.presentation,patched?'running':'complete');assert.equal(active.proof.shortcuts,0);
              await hidden.screenshot({path:directory+'/'+name+'-controlled-activation.png'});
              await hidden.waitForTimeout(5500);
              const end=await state(hidden,name+'-controlled-complete');
              assert.equal(end.presentation,'complete');assert.equal(end.inert,false);assert.deepEqual(end.proof.inputs,[]);
              await hidden.reload({waitUntil:'domcontentloaded'});
              await hidden.evaluate(()=>window.activateProof());
              await hidden.waitForSelector('[data-pixel-intro][data-stage="typing"]');
              await hidden.locator('[data-pixel-intro] button[data-intro-exit]').click();
              await hidden.waitForTimeout(1800);
              const exit=await state(hidden,name+'-intentional-exit');
              assert.equal(exit.presentation,'complete');assert.equal(exit.inert,false);assert.equal(exit.proof.shortcuts,1);
              await hiddenContext.close();
            }
          }finally{await writeFile(directory+'/results.json',JSON.stringify(results,null,2));await browser.close();}
          JS
          node /tmp/intro-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-intro-proof-${{ github.run_attempt }}
          path: /tmp/intro-proof
          retention-days: 7
