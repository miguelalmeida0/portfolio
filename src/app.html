<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="portfolio-build" content="2026.09.30-body-of-name" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf0df" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/images/avatar-32.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/images/avatar-180.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="preload" href="%sveltekit.assets%/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      [data-pixel-intro] { display: none; }
      html:is([data-presentation="pending"], [data-presentation="running"], [data-presentation="preview"], [data-presentation="exiting"]) [data-pixel-intro] { display: block; }
      html:is([data-presentation="pending"], [data-presentation="preview"]) #portfolio-content,
      html[data-presentation="running"]:not(:has([data-stage="transfer"], [data-stage="dismissing"])) #portfolio-content { visibility: hidden; pointer-events: none; }
      @media print { [data-pixel-intro] { display: none !important; } html #portfolio-content { visibility: visible !important; } }
    </style>
    %sveltekit.head%
    <script>
      /*
       * Resolves the motion policy before the first paint so the opening sequence
       * never flashes its final state first. `src/lib/motion/policy.ts` owns the
       * value from hydration onwards; without JavaScript no attribute is set and
       * every surface simply renders its finished composition.
       */
      (function () {
        try {
          var stored = null;
          try { stored = localStorage.getItem('miguel-motion-preference'); } catch (e) {}
          var systemReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
          var saveData = !!(navigator.connection && navigator.connection.saveData);
          var root = document.documentElement;
          root.dataset.motion =
            systemReduced || stored === 'reduced' || saveData ? 'reduced' : 'full';
          root.dataset.pointer = matchMedia('(pointer: fine) and (hover: hover)').matches
            ? 'fine'
            : 'coarse';
          /* The tab session decides before the body can paint. Reload never overrides seen-intro. */
          var seen = false;
          try { seen = sessionStorage.getItem('seen-intro') !== null; } catch (e) {}
          root.dataset.presentation = 'complete';
          var navigation = performance.getEntriesByType('navigation')[0];
          if (location.pathname === '/' && !location.hash && !seen && root.dataset.motion === 'full' && navigation?.type !== 'back_forward') {
            root.dataset.presentation = 'pending';
            // Claim this session at entry, including a refresh before the animation completes.
            try { sessionStorage.setItem('seen-intro', 'true'); } catch (e) {}
            root.dataset.introRestoration = history.scrollRestoration;
            history.scrollRestoration = 'manual';
            window.scrollTo(0, 0);
            var inputs = ['wheel', 'touchstart', 'touchmove', 'touchend', 'touchcancel', 'pointerdown', 'keydown', 'click'];
            var touchY;
            var touching = false;
            var touchTarget;
            var clearTouchTarget = function () { touchTarget?.removeEventListener('touchend', settle); touchTarget?.removeEventListener('touchcancel', settle); touchTarget = null; };
            var started = 0;
            var lastInput = 0;
            var pinTop = function () { if (started && window.scrollY !== 0) window.scrollTo(0, 0); };
            var cleanup = function () { inputs.forEach(function (type) { window.removeEventListener(type, settle, true); }); window.removeEventListener('scroll', pinTop); clearTouchTarget(); };
            var release = function () {
              var now = performance.now();
              if (now - started >= 1800 || (!touching && now - started >= 700 && now - lastInput >= 180)) cleanup();
              else setTimeout(release, 50);
            };
            var settle = function (event) {
              if (root.dataset.introHydrated) { cleanup(); return; }
              if (event?.type === 'pointerdown' && event.pointerType === 'touch') return;
              if (event?.type === 'touchstart') { clearTouchTarget(); touching = event.touches.length === 1; touchY = touching ? event.touches[0].clientY : undefined; touchTarget = event.target; touchTarget?.addEventListener('touchend', settle, { passive: true }); touchTarget?.addEventListener('touchcancel', settle, { passive: true }); return; }
              if (event?.type === 'touchend' || event?.type === 'touchcancel') { touching = false; touchY = undefined; lastInput = performance.now(); clearTouchTarget(); if (started) return; }
              if (event?.type === 'touchmove' && (touchY === undefined || event.touches.length !== 1 || Math.abs(event.touches[0].clientY - touchY) <= 8)) return;
              if (event && (root.dataset.presentation === 'pending' || started) &&
                  (event.type === 'wheel' && !event.ctrlKey && Math.abs(event.deltaY) > Math.abs(event.deltaX) || event.type === 'touchmove' && event.touches.length === 1 ||
                   event.type === 'keydown' && !event.metaKey && !event.ctrlKey && !event.altKey && ['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].includes(event.key))) {
                event.preventDefault();
                event.stopImmediatePropagation();
                lastInput = performance.now();
                if (!started) { window.scrollTo(0, 0); root.dataset.introShortcut = String(Date.now()); started = lastInput; setTimeout(release, 700); }
              }
              if (event?.type === 'wheel' && (event.ctrlKey || Math.abs(event.deltaY) <= Math.abs(event.deltaX))) return;
              if (root.dataset.presentation === 'pending' && !root.dataset.introHydrated) {
                root.dataset.presentation = 'exiting';
                var overlay = document.querySelector('[data-pixel-intro]');
                var complete = function () {
                  root.dataset.presentation = 'complete';
                  history.scrollRestoration = root.dataset.introRestoration || 'auto';
                  delete root.dataset.introRestoration;
                };
                if (overlay && overlay.animate) {
                  overlay.style.pointerEvents = 'none';
                  var fade = overlay.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 320, easing: 'cubic-bezier(.22, 1, .36, 1)', fill: 'forwards' });
                  fade.onfinish = complete;
                  setTimeout(complete, 500);
                } else complete();
              }
              if (!started) cleanup();
            };
            inputs.forEach(function (type) { window.addEventListener(type, settle, { passive: false, capture: true }); });
            window.addEventListener('scroll', pinTop, { passive: true });
            /* A stalled bundle must never leave an opening screen in the way. */
            setTimeout(settle, 6000);
          }
        } catch (e) {
          /* A failed probe leaves the finished, unanimated composition in place. */
        }
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
